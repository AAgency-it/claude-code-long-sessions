<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="t d">
  <title id="t">Compactions and time spent compacting, by threshold</title>
  <desc id="d">Six development sessions, 7,566 turns. Measured at a threshold of 188k tokens: 306 compactions, 4.9 hours. Estimated: 250k, 210 compactions and 3.4 hours; 300k, 168 compactions and 2.7 hours; 367k, 132 compactions and 2.1 hours. Average context per turn grows from 165k to 314k.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #1F2328; }
    .s { font-size: 16px; fill: #59636E; }
    .big { font-size: 26px; font-weight: 700; fill: #1F2328; }
    .sm { font-size: 14px; fill: #59636E; }
    .x { font-size: 18px; font-weight: 600; fill: #1F2328; }
    .note { font-size: 15px; fill: #59636E; }
    .pick { font-size: 14px; font-weight: 600; fill: #0F766E; }
  </style>
  <rect x="0.5" y="0.5" width="1279" height="499" rx="14" fill="#FCFCFA" stroke="#D0D7DE"/>
  <text class="h" x="48" y="62">Compacting later means fewer restarts</text>
  <text class="s" x="48" y="92">Six development sessions of one run, 7,566 turns. 188k is measured; the other thresholds are an estimate.</text>

  <line x1="120" y1="380" x2="1200" y2="380" stroke="#8C959F" stroke-width="1.5"/>

  <!-- 188k measured -->
  <rect x="180" y="150" width="160" height="230" rx="4" fill="#8C959F"/>
  <text class="big" x="260" y="140" text-anchor="middle">306</text>
  <text class="sm" x="260" y="110" text-anchor="middle">4.9 h compacting</text>
  <text class="x" x="260" y="410" text-anchor="middle">188k · measured</text>
  <text class="sm" x="260" y="432" text-anchor="middle">avg context 165k</text>

  <!-- 250k -->
  <rect x="440" y="222" width="160" height="158" rx="4" fill="#C9D1D9"/>
  <text class="big" x="520" y="212" text-anchor="middle">210</text>
  <text class="sm" x="520" y="182" text-anchor="middle">3.4 h compacting</text>
  <text class="x" x="520" y="410" text-anchor="middle">250k</text>
  <text class="sm" x="520" y="432" text-anchor="middle">avg context 216k</text>

  <!-- 300k chosen -->
  <rect x="700" y="254" width="160" height="126" rx="4" fill="#0F766E"/>
  <text class="big" x="780" y="244" text-anchor="middle">168</text>
  <text class="sm" x="780" y="214" text-anchor="middle">2.7 h compacting</text>
  <text class="pick" x="780" y="190" text-anchor="middle">what we chose</text>
  <text class="x" x="780" y="410" text-anchor="middle">300k</text>
  <text class="sm" x="780" y="432" text-anchor="middle">avg context 258k</text>

  <!-- 367k -->
  <rect x="960" y="281" width="160" height="99" rx="4" fill="#C9D1D9"/>
  <text class="big" x="1040" y="271" text-anchor="middle">132</text>
  <text class="sm" x="1040" y="241" text-anchor="middle">2.1 h compacting</text>
  <text class="x" x="1040" y="410" text-anchor="middle">367k</text>
  <text class="sm" x="1040" y="432" text-anchor="middle">avg context 314k</text>

  <text class="note" x="48" y="474">Compaction threshold, in tokens. Each compaction took 58 s on average and restarted from about 52k tokens.</text>
</svg>
