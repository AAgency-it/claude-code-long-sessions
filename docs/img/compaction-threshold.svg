<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="t d">
  <title id="t">Compactions and time spent compacting, by threshold</title>
  <desc id="d">Six development sessions, 7,566 turns. After a compaction the next call already carried about 145k tokens. Measured at a threshold of 188k: 43k of room, 306 compactions, 4.9 hours. Estimated: 250k, 105k of room, 125 compactions, 2.0 hours; 300k, 155k of room, 85 compactions, 1.4 hours; 367k, 222k of room, 59 compactions, 1.0 hour.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #1F2328; }
    .s { font-size: 16px; fill: #59636E; }
    .big { font-size: 26px; font-weight: 700; fill: #1F2328; }
    .sm { font-size: 14px; fill: #59636E; }
    .x { font-size: 18px; font-weight: 600; fill: #1F2328; }
    .note { font-size: 15px; fill: #59636E; }
    .pick { font-size: 14px; font-weight: 600; fill: #0F766E; }
  </style>
  <rect x="0.5" y="0.5" width="1279" height="539" rx="14" fill="#FCFCFA" stroke="#D0D7DE"/>
  <text class="h" x="48" y="62">The room between two compactions is what counts</text>
  <text class="s" x="48" y="92">Six development sessions of one run, 7,566 turns. 188k is measured; the other thresholds are estimated.</text>

  <line x1="120" y1="400" x2="1200" y2="400" stroke="#8C959F" stroke-width="1.5"/>

  <!-- 306 compactions = 230 px -->
  <rect x="180" y="170" width="160" height="230" rx="4" fill="#8C959F"/>
  <text class="big" x="260" y="160" text-anchor="middle">306</text>
  <text class="sm" x="260" y="130" text-anchor="middle">4.9 h compacting</text>
  <text class="x" x="260" y="430" text-anchor="middle">188k · measured</text>
  <text class="sm" x="260" y="452" text-anchor="middle">room 43k</text>

  <rect x="440" y="306" width="160" height="94" rx="4" fill="#C9D1D9"/>
  <text class="big" x="520" y="296" text-anchor="middle">125</text>
  <text class="sm" x="520" y="266" text-anchor="middle">2.0 h compacting</text>
  <text class="x" x="520" y="430" text-anchor="middle">250k</text>
  <text class="sm" x="520" y="452" text-anchor="middle">room 105k</text>

  <rect x="700" y="336" width="160" height="64" rx="4" fill="#0F766E"/>
  <text class="big" x="780" y="326" text-anchor="middle">85</text>
  <text class="sm" x="780" y="296" text-anchor="middle">1.4 h compacting</text>
  <text class="pick" x="780" y="272" text-anchor="middle">what we chose</text>
  <text class="x" x="780" y="430" text-anchor="middle">300k</text>
  <text class="sm" x="780" y="452" text-anchor="middle">room 155k</text>

  <rect x="960" y="355" width="160" height="45" rx="4" fill="#C9D1D9"/>
  <text class="big" x="1040" y="345" text-anchor="middle">59</text>
  <text class="sm" x="1040" y="315" text-anchor="middle">1.0 h compacting</text>
  <text class="x" x="1040" y="430" text-anchor="middle">367k</text>
  <text class="sm" x="1040" y="452" text-anchor="middle">room 222k</text>

  <text class="note" x="48" y="496">Compaction threshold, in tokens. The summary is about 52k, but the first call after it already carries about 145k:</text>
  <text class="note" x="48" y="518">Claude Code attaches the recently read files again. Room = threshold minus that restart. Each compaction took 58 s.</text>
</svg>
