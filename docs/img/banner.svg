<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">claude-code-long-sessions</title>
  <desc id="d">A context gauge: the context fills up, the memory hook reminds the session to save its state file at 233k and 273k tokens, compaction fires near 300k, and the session restarts at about 52k with its state file put back.</desc>
  <defs>
    <linearGradient id="fill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#134E4A"/>
      <stop offset="0.7" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5EEAD4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 46px; font-weight: 700; fill: #F8FAFC; letter-spacing: -0.5px; }
    .tag { font-size: 21px; fill: #A9B4C2; }
    .lab { font-size: 15px; fill: #CBD5E1; }
    .num { font-size: 15px; font-weight: 600; fill: #F8FAFC; }
    .foot { font-size: 15px; fill: #7D8A9C; }
  </style>
  <rect width="1280" height="400" rx="18" fill="#0B1220"/>
  <text class="title" x="64" y="104">claude-code-long-sessions</text>
  <text class="tag" x="64" y="146">Long Claude Code sessions that cost less, and keep their thread when the context is compacted.</text>

  <!-- gauge: 0 to 333k tokens over 1152 px (3.459 px per 1k) -->
  <rect x="64" y="236" width="1152" height="22" rx="11" fill="#1E293B"/>
  <rect x="64" y="236" width="1038" height="22" rx="11" fill="url(#fill)"/>

  <!-- restart arrow from compaction back to ~52k -->
  <path d="M1102 230 C 1080 168, 290 168, 244 230" fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#head)"/>
  <text class="lab" x="673" y="172" text-anchor="middle">state file put back into the context after compaction</text>

  <!-- ticks -->
  <g stroke="#F8FAFC" stroke-width="2">
    <line x1="244" y1="262" x2="244" y2="276"/>
    <line x1="870" y1="262" x2="870" y2="276"/>
    <line x1="1008" y1="262" x2="1008" y2="276"/>
    <line x1="1102" y1="262" x2="1102" y2="276"/>
  </g>
  <text class="num" x="244" y="296" text-anchor="middle">~52k</text>
  <text class="lab" x="244" y="316" text-anchor="middle">restart</text>
  <text class="num" x="870" y="296" text-anchor="middle">233k</text>
  <text class="lab" x="870" y="316" text-anchor="middle">reminder</text>
  <text class="num" x="1008" y="296" text-anchor="middle">273k</text>
  <text class="lab" x="1008" y="316" text-anchor="middle">urgent</text>
  <text class="num" x="1112" y="296" text-anchor="start">~300k</text>
  <text class="lab" x="1112" y="316" text-anchor="start">compaction</text>
  <line x1="1216" y1="262" x2="1216" y2="276" stroke="#7D8A9C" stroke-width="2"/>
  <text class="lab" x="1216" y="342" text-anchor="end">window 333k tokens</text>

  <text class="foot" x="64" y="378">memory hook · usage analysis · run report · balanced test split · procedures for many sessions — Python 3.10+, standard library, MIT</text>
</svg>
